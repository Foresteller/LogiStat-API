version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: logistat-php
    volumes:
      - ./src:/var/www
    container_name: logistat-app
    tty: true
    networks:
      - logistat-network
  web:
    image: nginx:alpine
    container_name: logistat_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - logistat-network
    depends_on:
      - app
  db:
    image: postgres:15-alpine
    container_name: logistat_db
    networks:
      - logistat-network
    environment:
      - POSTGRES_DB=logistat_db
      - POSTGRES_USER=logistat_user
      - POSTGRES_PASSWORD=logistat_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    tty: true
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    container_name: logistat-redis
    networks:
      - logistat-network
    volumes:
      - redis_data:/data
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: logistat_queue_worker
    networks:
      - logistat-network
    volumes:
      - ./src:/var/www
    command: php /var/www/artisan queue:work --verbose --tries=3 --timeout=90
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
networks:
  logistat-network:










