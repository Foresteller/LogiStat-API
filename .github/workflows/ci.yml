name: CI Pipeline

on:
  push:
    branches: [develop, main, feat/ci-pipeline]
  pull_request:
    branches: [develop, main]
jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: logistat-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret_postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup PHP environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo, pdo_pgsql, bcmath, json, ctype, tokenizer,redis
          coverage: none
      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Setup Environment File
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing
      - name: Check Code Style
        run: vendor/bin/pint --test
      - name: Create Storage Folder
        run: mkdir -p storage/framework/{sessions,views,cache} storage/logs
      - name: Run Test Suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: logistat-test
          DB_USERNAME: postgres
          DB_PASSWORD: secret_postgres
          QUEUE_CONNECTION: redis
          REDIS_HOST: 127.0.0.1
        run: php artisan test
